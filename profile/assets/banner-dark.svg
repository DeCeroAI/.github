<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="DeCeroAI Solutions. AI from prototype to production.">
<style>
@font-face{font-family:"ND";src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"NS";src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"NI";src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"MS";src:url(data:font/woff2;base64,) format("woff2")}
.eyebrow{font:14px "MS",sans-serif;letter-spacing:3px;fill:#22d3ee}
.name{font:84px "ND",Georgia,serif;fill:#e4e4e7;letter-spacing:-1px}
.lead{font:36px "NS",Georgia,serif;fill:#a1a1aa}
.em{font:36px "NI",Georgia,serif;font-style:italic;fill:#22d3ee}
.mark{font:260px "NI",Georgia,serif;font-style:italic;fill:none;stroke:#e4e4e7;stroke-width:1.2;opacity:0.07}
.pill rect{fill:#111118;stroke:#e4e4e7;stroke-opacity:.16}
.pill text{font:15px "MS",sans-serif;letter-spacing:.3px;fill:#a1a1aa}
.pill.first rect{stroke:#fbbf24;stroke-opacity:.7}
.pill.first text{fill:#fbbf24}
.pill.last rect{stroke:#22d3ee;stroke-opacity:.9;animation:arrive 6s ease-in-out infinite}
.pill.last text{fill:#22d3ee}
.flow{stroke-dasharray:3 9;animation:flow 1.4s linear infinite}
.packet{animation:travel 6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes travel{0%{transform:translateX(0);opacity:0}6%{opacity:1}70%{transform:translateX(997.6px);opacity:1}82%,100%{transform:translateX(997.6px);opacity:0}}
@keyframes arrive{0%,64%{fill:#111118;fill-opacity:1;filter:none}74%{fill:#22d3ee;fill-opacity:.18;filter:url(#glow)}100%{fill:#111118;fill-opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.flow,.packet,.pill.last rect{animation:none}.packet{opacity:0}}
</style>
<defs>
<radialGradient id="cool" cx="1140" cy="30" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
<radialGradient id="warm" cx="60" cy="440" r="460" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.1"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="wire" x1="139.3" x2="1136.8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e4e4e7" fill-opacity="0.08"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="400" fill="#0a0a0f"/>
<rect width="1280" height="400" fill="url(#dots)"/>
<rect width="1280" height="400" fill="url(#cool)"/>
<rect width="1280" height="400" fill="url(#warm)"/>
<text class="mark" x="1240" y="250" text-anchor="end">de0</text>
<text class="eyebrow" x="82" y="86">DE0, LLC  &#183;  WAUNAKEE, WISCONSIN</text>
<text class="name" x="76" y="172">DeCeroAI Solutions</text>
<text x="80" y="232"><tspan class="lead">AI from prototype to </tspan><tspan class="em">production.</tspan></text>
<line x1="139.3" y1="326" x2="1136.8" y2="326" stroke="#e4e4e7" stroke-opacity=".14" stroke-width="2"/>
<line class="flow" x1="139.3" y1="326" x2="1136.8" y2="326" stroke="url(#wire)" stroke-opacity=".75" stroke-width="2"/>
<g class="packet"><circle cx="139.3" cy="326" r="6" fill="#22d3ee" filter="url(#glow)"/></g>
<g class="pill first"><rect x="80.0" y="306.0" width="118.6" height="40" rx="20.0"/><text x="139.3" y="331" text-anchor="middle">prototype</text></g><g class="pill"><rect x="318.4" y="306.0" width="155.4" height="40" rx="20.0"/><text x="396.1" y="331" text-anchor="middle">map the reality</text></g><g class="pill"><rect x="593.6" y="306.0" width="121.5" height="40" rx="20.0"/><text x="654.4" y="331" text-anchor="middle">data spine</text></g><g class="pill"><rect x="835.0" y="306.0" width="118.8" height="40" rx="20.0"/><text x="894.4" y="331" text-anchor="middle">guardrails</text></g><g class="pill last"><rect x="1073.7" y="306.0" width="126.3" height="40" rx="20.0"/><text x="1136.8" y="331" text-anchor="middle">production</text></g>
</svg>
